name: Build Windows

on:
  push:
    branches: [ main, master ]
    paths: [ 'windows-app/**', 'windows-native/**', '.github/workflows/build-windows.yml' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows-app/ScreenTimeSync.sln
      - name: Build
        run: dotnet build windows-app/ScreenTimeSync.sln -c Release --no-restore
      - name: Publish single file
        run: dotnet publish windows-app/ScreenTimeSync/ScreenTimeSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeSync-Windows
          path: publish/
