name: Build APK

on:
  push:
    branches: [ main, master ]
    paths: [ 'android-app/**', '.github/workflows/build-apk.yml' ]
  pull_request:
    paths: [ 'android-app/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeSync-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create Release APK copy
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p releases
          cp android-app/app/build/outputs/apk/debug/app-debug.apk releases/ScreenTimeSync-v1.0.0.apk
          ls -lh releases/
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
